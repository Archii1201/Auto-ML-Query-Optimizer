# Phase 4E — nginx as API gateway + load balancer in front of the two
# ML-service replicas. Demonstrates the "API Gateway" + "horizontal
# scaling / load balancing" boxes from the system-flow doc.

worker_processes auto;
events { worker_connections 1024; }

http {
    # least_conn suits variable-latency backends (some queries are slow):
    # route each request to the replica with the fewest active connections.
    upstream ml_backend {
        least_conn;
        server ml-service-1:8000 max_fails=3 fail_timeout=15s;
        server ml-service-2:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # JSON-ish access log including upstream + latency for debugging LB.
    log_format main '$remote_addr "$request" $status '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # ---- HTTP ----
    # HTTP-only by default so `docker compose up` always starts cleanly
    # (no cert prerequisite). For TLS, generate certs with
    # deploy/nginx/gen-certs.sh and mount deploy/nginx/nginx-tls.conf
    # instead of this file (see docs/PHASE4E_ORCHESTRATION.md).
    server {
        listen 80;

        # nginx-level liveness; doesn't touch the backends.
        location = /gateway-health { return 200 "ok\n"; }

        # Readiness is per-replica; nginx removes unhealthy upstreams via
        # max_fails, so just proxy everything else.
        location / {
            proxy_pass http://ml_backend;
        }
    }
}
