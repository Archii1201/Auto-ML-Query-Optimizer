# Phase 4E — TLS-enabled nginx config (HTTP -> HTTPS + HTTPS proxy).
# Use this INSTEAD of nginx.conf once you've generated certs:
#   bash deploy/nginx/gen-certs.sh
# then in docker-compose.yml mount this file:
#   - ./deploy/nginx/nginx-tls.conf:/etc/nginx/nginx.conf:ro

worker_processes auto;
events { worker_connections 1024; }

http {
    upstream ml_backend {
        least_conn;
        server ml-service-1:8000 max_fails=3 fail_timeout=15s;
        server ml-service-2:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    log_format main '$remote_addr "$request" $status '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # Redirect plain HTTP to HTTPS.
    server {
        listen 80;
        location = /gateway-health { return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location = /gateway-health { return 200 "ok\n"; }
        location / { proxy_pass http://ml_backend; }
    }
}
