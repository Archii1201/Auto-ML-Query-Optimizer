# Phase 4D — Prometheus scrape config.
# Scrapes each ML-service replica's Prometheus exposition at
# /metrics?fmt=prom (the `params` block appends the query string).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ml-service
    metrics_path: /metrics
    params:
      fmt: ["prom"]
    static_configs:
      - targets: ["ml-service-1:8000", "ml-service-2:8000"]
        labels:
          service: ml_service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
